spring.cache.type: none
spring:
  cache:
    type: none

  liquibase:
    enabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:postgresql://localhost:5433/jira-test
    username: jira
    password: JiraRush

logging:
  level:
    root: WARN
    org.hibernate.SQL: OFF
    org.springframework: WARN
    com.codegym.jira: INFO